# Netlify detects Next.js and applies its OpenNext-based adapter automatically.
# Secrets are configured in the Netlify UI (Site configuration > Environment
# variables), never in this file.

[build]
  # Applies pending database migrations, then builds. The migration step is
  # skipped with a warning when no database URL is available at build time.
  command = "npm run build:netlify"
  publish = ".next"

[build.environment]
  NODE_VERSION = "22"
